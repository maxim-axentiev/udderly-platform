# Production stack for the Udderly Platform API only (no frontend).
# Project name: udderly-platform-production
#
# Traefik is NOT defined here. It already runs under /opt/traefik and
# discovers this API via the external Docker network `web`.
#
# Temporary public routing: goatbarn.udderlyridiculousfarmlife.com → API.
# The unfinished web app is not deployed (no authentication yet).

name: udderly-platform-production

services:
  postgres:
    image: postgres:16
    container_name: udderly-platform-production-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7
    container_name: udderly-platform-production-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
      ]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    profiles: ["migrate"]
    image: udderly-platform-api:production
    pull_policy: never
    restart: "no"
    working_dir: /app
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://goatbarn.udderlyridiculousfarmlife.com}
    command: ["npm", "run", "db:migrate", "-w", "@udderly/api"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: udderly-platform-api:production
    pull_policy: never
    container_name: udderly-platform-production-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_LISTEN_HOST: "0.0.0.0"
      API_PORT: ${API_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      WHEREWOLF_API_KEY: ${WHEREWOLF_API_KEY:-}
      WHEREWOLF_APP_ID: ${WHEREWOLF_APP_ID:-}
      FAREHARBOR_WEBHOOK_SECRET: ${FAREHARBOR_WEBHOOK_SECRET:-}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-}
      SQUARE_APPLICATION_ID: ${SQUARE_APPLICATION_ID:-}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web
      - internal
    healthcheck:
      # Liveness only (process up). /health/ready is used by the deploy script.
      # Using /health avoids Docker restart loops when Postgres/Redis blip;
      # integration events remain durable in Postgres.
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+(process.env.API_PORT||'3001')+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.udderly-platform-production.rule=Host(`goatbarn.udderlyridiculousfarmlife.com`)
      - traefik.http.routers.udderly-platform-production.entrypoints=websecure
      - traefik.http.routers.udderly-platform-production.tls=true
      - traefik.http.routers.udderly-platform-production.tls.certresolver=letsencrypt
      - traefik.http.services.udderly-platform-production.loadbalancer.server.port=${API_PORT:-3001}

networks:
  internal:
    name: udderly-platform-production-internal
    internal: true
  web:
    name: web
    external: true

volumes:
  postgres_data:
    name: udderly-platform-production-postgres-data
  redis_data:
    name: udderly-platform-production-redis-data
