# Production stack for the Udderly Platform API and gift-card campaign site.
# Project name: udderly-platform-production
#
# Traefik is NOT defined here. It already runs under /opt/traefik and
# discovers containers on the external Docker network `web`.
#
# goatbarn.udderlyridiculousfarmlife.com → API (unchanged, no campaign password).
# giftcard.udderlyridiculousfarmlife.com → campaign site, still behind Basic Auth.
# /naming, /inventory/, and /photos/ go to this API ahead of the website.
# /naming keeps Basic Auth. /inventory/ and /photos/ do not, so staff
# sessions and published photographs work. The page /inventory stays on the website.

name: udderly-platform-production

services:
  postgres:
    image: postgres:16
    container_name: udderly-platform-production-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7
    container_name: udderly-platform-production-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
      ]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    profiles: ["migrate"]
    image: udderly-platform-api:production
    pull_policy: never
    restart: "no"
    working_dir: /app
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://goatbarn.udderlyridiculousfarmlife.com}
    command: ["npm", "run", "db:migrate", "-w", "@udderly/api"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: udderly-platform-api:production
    pull_policy: never
    container_name: udderly-platform-production-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_LISTEN_HOST: "0.0.0.0"
      API_PORT: ${API_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      WHEREWOLF_API_KEY: ${WHEREWOLF_API_KEY:-}
      WHEREWOLF_APP_ID: ${WHEREWOLF_APP_ID:-}
      FAREHARBOR_WEBHOOK_SECRET: ${FAREHARBOR_WEBHOOK_SECRET:-}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-}
      SQUARE_APPLICATION_ID: ${SQUARE_APPLICATION_ID:-}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-}
      GOOGLE_ANALYTICS_PROPERTY_ID: ${GOOGLE_ANALYTICS_PROPERTY_ID:-}
      GOOGLE_ANALYTICS_CLIENT_ID: ${GOOGLE_ANALYTICS_CLIENT_ID:-}
      GOOGLE_ANALYTICS_CLIENT_SECRET: ${GOOGLE_ANALYTICS_CLIENT_SECRET:-}
      GOOGLE_ANALYTICS_REFRESH_TOKEN: ${GOOGLE_ANALYTICS_REFRESH_TOKEN:-}
      GOOGLE_SEARCH_CONSOLE_SITE_URL: ${GOOGLE_SEARCH_CONSOLE_SITE_URL:-}
      GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${GOOGLE_SEARCH_CONSOLE_CLIENT_ID:-}
      GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: ${GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET:-}
      GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN: ${GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN:-}
      META_ADS_ACCOUNT_ID: ${META_ADS_ACCOUNT_ID:-}
      META_ADS_ACCESS_TOKEN: ${META_ADS_ACCESS_TOKEN:-}
      MAILCHIMP_API_KEY: ${MAILCHIMP_API_KEY:-}
      NAMING_CAMPAIGN_ENABLED: ${NAMING_CAMPAIGN_ENABLED:-false}
      NAMING_PREVIEW_MODE: ${NAMING_PREVIEW_MODE:-false}
      # Empty closes staff test checkout. A UUID does not enable customer purchasing.
      NAMING_TEST_CHECKOUT_OBJECT_ID: ${NAMING_TEST_CHECKOUT_OBJECT_ID:-}
      NAMING_FAREHARBOR_TIERS: ${NAMING_FAREHARBOR_TIERS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NAMING_PUBLIC_BASE_URL: ${NAMING_PUBLIC_BASE_URL:-}
      NAMING_ADMIN_PASSWORD: ${NAMING_ADMIN_PASSWORD:-}
      NAMING_ADMIN_SESSION_SECRET: ${NAMING_ADMIN_SESSION_SECRET:-}
      NAMING_PHOTO_DIR: /data/naming-photos
    volumes:
      - naming_photos:/data/naming-photos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web
      - internal
    healthcheck:
      # Liveness only (process up). /health/ready is used by the deploy script.
      # Using /health avoids Docker restart loops when Postgres/Redis blip;
      # integration events remain durable in Postgres.
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+(process.env.API_PORT||'3001')+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.udderly-platform-production.rule=Host(`goatbarn.udderlyridiculousfarmlife.com`)
      - traefik.http.routers.udderly-platform-production.entrypoints=websecure
      - traefik.http.routers.udderly-platform-production.tls=true
      - traefik.http.routers.udderly-platform-production.tls.certresolver=letsencrypt
      - traefik.http.routers.udderly-platform-production.middlewares=goatbarn-route
      - traefik.http.middlewares.goatbarn-route.headers.customrequestheaders.X-Udderly-Naming-Route=closed
      - traefik.http.services.udderly-platform-production.loadbalancer.server.port=${API_PORT:-3001}
      - traefik.http.middlewares.giftcard-auth.basicauth.realm=Udderly gift card
      - traefik.http.middlewares.giftcard-auth.basicauth.users=${GIFT_CARD_BASIC_AUTH:-}
      - traefik.http.routers.giftcard-naming.rule=Host(`giftcard.udderlyridiculousfarmlife.com`) && PathPrefix(`/naming`)
      - traefik.http.routers.giftcard-naming.priority=100
      - traefik.http.routers.giftcard-naming.entrypoints=websecure
      - traefik.http.routers.giftcard-naming.tls=true
      - traefik.http.routers.giftcard-naming.tls.certresolver=letsencrypt
      - traefik.http.routers.giftcard-naming.service=udderly-platform-production
      - traefik.http.routers.giftcard-naming.middlewares=giftcard-auth,giftcard-naming-route
      - traefik.http.middlewares.giftcard-naming-route.headers.customrequestheaders.X-Udderly-Naming-Route=giftcard
      - traefik.http.routers.giftcard-inventory.rule=Host(`giftcard.udderlyridiculousfarmlife.com`) && PathPrefix(`/inventory/`)
      - traefik.http.routers.giftcard-inventory.priority=100
      - traefik.http.routers.giftcard-inventory.entrypoints=websecure
      - traefik.http.routers.giftcard-inventory.tls=true
      - traefik.http.routers.giftcard-inventory.tls.certresolver=letsencrypt
      - traefik.http.routers.giftcard-inventory.service=udderly-platform-production
      - traefik.http.routers.giftcard-inventory.middlewares=giftcard-api-closed
      - traefik.http.routers.giftcard-photos.rule=Host(`giftcard.udderlyridiculousfarmlife.com`) && PathPrefix(`/photos/`)
      - traefik.http.routers.giftcard-photos.priority=100
      - traefik.http.routers.giftcard-photos.entrypoints=websecure
      - traefik.http.routers.giftcard-photos.tls=true
      - traefik.http.routers.giftcard-photos.tls.certresolver=letsencrypt
      - traefik.http.routers.giftcard-photos.service=udderly-platform-production
      - traefik.http.routers.giftcard-photos.middlewares=giftcard-api-closed
      - traefik.http.middlewares.giftcard-api-closed.headers.customrequestheaders.X-Udderly-Naming-Route=closed

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: udderly-platform-web:production
    pull_policy: never
    container_name: udderly-platform-production-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Temporary private preview. Does not enable purchases or the naming API.
      NAMING_PREVIEW_MODE: ${NAMING_PREVIEW_MODE:-true}
      NAMING_FAREHARBOR_TIERS: ${NAMING_FAREHARBOR_TIERS:-}
    networks:
      - web
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.giftcard-web.rule=Host(`giftcard.udderlyridiculousfarmlife.com`)
      - traefik.http.routers.giftcard-web.priority=1
      - traefik.http.routers.giftcard-web.entrypoints=websecure
      - traefik.http.routers.giftcard-web.tls=true
      - traefik.http.routers.giftcard-web.tls.certresolver=letsencrypt
      - traefik.http.routers.giftcard-web.middlewares=giftcard-auth
      - traefik.http.services.giftcard-web.loadbalancer.server.port=3000

networks:
  internal:
    name: udderly-platform-production-internal
    internal: true
  web:
    name: web
    external: true

volumes:
  postgres_data:
    name: udderly-platform-production-postgres-data
  redis_data:
    name: udderly-platform-production-redis-data
  # Existing production volume. External so Compose never creates, renames, or deletes it.
  naming_photos:
    name: udderly-platform-production-naming-photos
    external: true
